# Klods — deploy stack using the published GHCR images.
#
# Usage (Docker CLI):
#   1. Download this file and .env.example next to each other.
#   2. cp .env.example .env  and fill in the values (see comments in .env.example).
#   3. docker compose -f compose.ghcr.yaml up -d
#
# Usage (Portainer): Stacks -> Add stack -> Web editor -> paste this file, then set the
#   same variables under the stack's "Environment variables" section, and Deploy.
#
# First run: the API prints a generated admin password once in its logs
#   (docker compose -f compose.ghcr.yaml logs klods_api | grep "generated password"),
#   unless you set ADMIN_DEFAULT_PASSWORD yourself. Sign in as ADMIN_USERNAME and change it.
#
# Pinned to :latest for simplicity — pin to a version (e.g. :1.0.1) for reproducible deploys.

name: klods

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - klods-db-volume:/var/lib/postgresql/data:rw
    # Bound to the host loopback only — reach it remotely over an SSH tunnel
    # (Rider datasource -> SSH/SSL tab). Change to "5105:5432" to expose it on
    # all interfaces if the host is firewalled/VPN-only and you want direct access.
    ports:
      - "127.0.0.1:5105:5432"
    networks: [klods-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  # S3-compatible image cache (RustFS — MinIO stopped publishing images). It only holds copies of
  # Rebrickable images, so a fresh volume just refills as images are viewed.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - klods-rustfs-volume:/data
    networks: [klods-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  klods_api:
    image: ghcr.io/thomaslewis1028/klods-api:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REBRICKABLE_API_KEY: ${REBRICKABLE_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      # Set this if you put a reverse proxy in front (see .env.example) so IP-based rate limiting
      # sees the real client IP instead of the proxy's. Leave unset if there's no proxy.
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-}
      # Public URL of the web app (klods_web). REQUIRED — the API redirects the
      # browser here after OAuth sign-in. If unset it would fall back to localhost
      # and send users to their own machine, so Compose refuses to start without it.
      BLAZOR_ORIGIN: ${BLAZOR_ORIGIN:?set BLAZOR_ORIGIN to the public URL of the web app, e.g. https://klods.example.net}
      # MCP key limits — only matter if you run klods_mcp. Counted per user across all their keys.
      MCP_RATE_READS_PER_MIN: ${MCP_RATE_READS_PER_MIN:-60}
      MCP_RATE_WRITES_PER_MIN: ${MCP_RATE_WRITES_PER_MIN:-30}
      MCP_MAX_KEYS_PER_USER: ${MCP_MAX_KEYS_PER_USER:-5}
      # OAuth providers — each is skipped unless BOTH its id and secret are set.
      # Register {API_PUBLIC_URL}/signin-<provider> as the redirect URI in each console.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    ports:
      - "5101:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # API migrates the DB, seeds the admin, and creates the image bucket on boot — give it room.
      start_period: 60s
    networks: [klods-network]

  klods_web:
    image: ghcr.io/thomaslewis1028/klods-web:latest
    restart: unless-stopped
    environment:
      API_BASE_URL: http://klods_api:8080
      # Public URL the browser uses to reach the API for the OAuth challenge.
      # REQUIRED — see BLAZOR_ORIGIN above. Often the same host as BLAZOR_ORIGIN
      # when a reverse proxy path-routes /auth, /signin-*, and /api to the API.
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL to the public URL of the API, e.g. https://klods.example.net}
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # See the same variable on klods_api above.
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-}
      # Persist DataProtection keys (antiforgery tokens) on the volume below so they
      # survive container restarts.
      DATAPROTECTION_KEYS_PATH: /home/app/dp-keys
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      klods_api: { condition: service_healthy }
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - klods-dp-keys-volume:/home/app/dp-keys:rw
    networks: [klods-network]

  # Optional MCP server — only started when the "mcp" profile is enabled:
  #   docker compose -f compose.ghcr.yaml --profile mcp up -d
  # (Portainer: add COMPOSE_PROFILES=mcp to the stack's environment variables.)
  # An admin must also switch on "MCP access" on the Admin page before users can create keys.
  # It holds no secrets: every tool call is forwarded to klods_api with the caller's own MCP key.
  klods_mcp:
    image: ghcr.io/thomaslewis1028/klods-mcp:latest
    profiles: [mcp]
    restart: unless-stopped
    environment:
      KLODS_API_URL: http://klods_api:8080
    depends_on:
      klods_api: { condition: service_healthy }
    ports:
      - "5106:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [klods-network]

volumes:
  klods-dp-keys-volume:
  klods-db-volume:
  klods-rustfs-volume:

networks:
  klods-network:
    driver: bridge
