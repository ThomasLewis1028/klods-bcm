name: klods

services:
  # https://github.com/felipewom/docker-compose-postgres/blob/main/README.md
  #
  # NOTE ON CONFIG: every service loads its config from `.env` via `env_file`, NOT via
  # `environment: KEY: ${KEY}` interpolation. This is deliberate — `${KEY}` is resolved by
  # Docker Compose from the *shell* environment first and `.env` only second, so a stale export
  # in your shell (e.g. POSTGRES_DB) would silently override `.env` and point the app at the wrong
  # database. `env_file` reads `.env` directly into the container and can't be shadowed that way.
  postgres:
    image: 'postgres:17'
    # Loopback only — reach it remotely over an SSH tunnel if needed. The raw DB port has no
    # business being reachable from the LAN/internet even in dev.
    ports:
      - "127.0.0.1:5105:5432"
    env_file:
      - .env
    networks:
      - klods-network
    volumes:
      - klods-db-volume:/var/lib/postgresql/data/:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  # Full DB-admin UI — loopback only, never expose this beyond the host.
  pgwebadmin:
    image: dpage/pgadmin4
    ports:
      - "127.0.0.1:5102:80"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      - klods-network
    volumes:
      - klods-pgadmin-volume:/var/lib/pgadmin/:rw

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Loopback only — the S3 API and (especially) the admin console shouldn't be reachable
    # off the host; klods_api/klods_web reach it over the internal Docker network instead.
    ports:
      - "127.0.0.1:5103:9000"
      - "127.0.0.1:5104:9001"
    env_file:
      - .env
    networks:
      - klods-network
    volumes:
      - klods-minio-volume:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  klods_api:
    image: klods_api
    build:
      context: .
      dockerfile: Klods.Api/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0-dev}
    env_file:
      - .env
    environment:
      BLAZOR_ORIGIN: "${BLAZOR_ORIGIN:-http://localhost:5100}"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
    ports:
      - "5101:8080"
    networks:
      - klods-network

  klods_web:
    image: klods_web
    build:
      context: .
      dockerfile: Klods.Web/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0-dev}
    env_file:
      - .env
    environment:
      API_BASE_URL: "http://klods_api:8080"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:5101}"
      DATAPROTECTION_KEYS_PATH: /home/app/dp-keys
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      klods_api:
        condition: service_started
        restart: true
    ports:
      - "5100:8080"
    networks:
      - klods-network
    volumes:
      - klods-dp-keys-volume:/home/app/dp-keys:rw

volumes:
  klods-dp-keys-volume:
  klods-db-volume:
  klods-pgadmin-volume:
  klods-minio-volume:

networks:
  klods-network:
    driver: bridge
